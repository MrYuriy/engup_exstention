<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>LangUp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="brand">
      <span class="brand__logo">L</span>
      <span class="brand__name">LangUp</span>
    </header>

    <!-- LOGIN -->
    <section id="login-view" class="view hidden">
      <p class="hint">Увійди, щоб зберігати виділені слова у свій словник.</p>

      <form id="password-form" class="form">
        <input id="email" type="email" placeholder="Email" autocomplete="email" required />
        <input
          id="password"
          type="password"
          placeholder="Пароль"
          autocomplete="current-password"
          minlength="8"
          required
        />
        <button id="password-login-btn" type="submit" class="btn btn--primary">Увійти</button>
        <button id="register-btn" type="button" class="btn btn--ghost">Зареєструватись</button>
      </form>

      <div class="divider"><span>або</span></div>

      <button id="login-btn" class="btn btn--google">
        <span class="g">G</span> Увійти через Google
      </button>
      <p id="status" class="status"></p>
      <details class="setup">
        <summary>Налаштування OAuth</summary>
        <p>Додай цей Redirect URI у Google OAuth client:</p>
        <code id="redirect-uri">—</code>
      </details>
    </section>

    <!-- PROFILE -->
    <section id="profile-view" class="view hidden">
      <div class="profile">
        <div id="avatar" class="avatar">?</div>
        <div class="profile__id">
          <strong id="p-name">—</strong>
          <span id="p-email" class="muted">—</span>
        </div>
      </div>
      <p class="tip">Виділи слово на будь-якій сторінці та натисни «+», щоб зберегти.</p>
      <button id="logout-btn" class="btn btn--ghost">Вийти</button>
    </section>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
